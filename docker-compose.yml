# KGCS local development stack
#
# Starts a Neo4j database and the KGCS orchestrator API together.
#
# Usage:
#   cp .env.example .env          # then fill in credentials
#   docker-compose up --build     # first run
#   docker-compose up -d          # subsequent runs (detached)
#   docker-compose down           # stop
#
# Access:
#   API:         http://localhost:8080
#   Neo4j UI:    http://localhost:7474  (user: neo4j / pass: from .env)

services:

  neo4j:
    # Community is fine here: this stack builds a fresh graph via kgcs-pipeline's ETL
    # (Option B), it does not load the published dump. If you instead want to load that
    # dump into this stack, switch to neo4j:2026.05-enterprise and add
    # NEO4J_ACCEPT_LICENSE_AGREEMENT=yes -- Community cannot load it (Block storage format,
    # Enterprise-only). See docs/mcp/install-guide.md.
    image: neo4j:2026.05-community
    ports:
      - "7474:7474"   # Browser / HTTP API
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-changeme}"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO", "-", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 10

  orchestrator:
    build: .
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    env_file:
      - .env
    environment:
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "neo4j"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-changeme}"
      PYTHONPATH: "/app"
    depends_on:
      neo4j:
        condition: service_healthy
    restart: on-failure

volumes:
  neo4j_data:
